name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node bin/generate.mjs --transactions 5000 --claims 5 --out data/smoke.x12
      - run: node --max-old-space-size=25 bin/run.mjs data/smoke.x12
